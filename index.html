<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F3D2F" />
    <meta name="description" content="DukanKhata™ — Complete retail management SaaS for Indian shops. Daily closing, POS billing, inventory tracking, customer Udhar ledger, and GST reports." />
    <meta name="keywords" content="DukanKhata, retail software, POS billing, Udhar khata, daily closing, Indian shop accounting, inventory management, GST billing" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <title>DukanKhata™ — Modern Retail Management &amp; POS SaaS for Indian Businesses</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-shell" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FAFDF9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 14px;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: #0F3D2F; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 20px; font-weight: 800; box-shadow: 0 4px 12px rgba(15, 61, 47, 0.25);">
          🏪
        </div>
        <div style="font-size: 15px; font-weight: 700; color: #0A2B25; letter-spacing: -0.01em;">
          Dukan<span style="color: #D97706;">Khata</span>
        </div>
        <div style="width: 130px; height: 3px; border-radius: 99px; background: #E2E8F0; overflow: hidden; position: relative;">
          <div style="width: 45%; height: 100%; background: #0F3D2F; border-radius: 99px; animation: dkShellPulse 1s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes dkShellPulse {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
